[package]
name = "sharehub-desktop"
version = "1.0.0"
description = "ShareHub Desktop control endpoint"
authors = ["ShareHub"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
enigo = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0"
image = "0.25"
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
