<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShareHub Desktop</title>
<style>
  :root{color-scheme:dark} *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0f19;color:#e2e8f0;height:100vh;display:flex;flex-direction:column}
  header{padding:14px 18px;display:flex;align-items:center;gap:8px}header .logo{font-size:20px}header b{font-size:15px}
  main{flex:1;display:grid;place-items:center;padding:18px}
  .box{text-align:center;max-width:320px}
  .ring{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:42px;border:3px solid #334155}
  .ring.on{border-color:#34d399;box-shadow:0 0 0 6px #34d39918}
  .state{font-size:20px;font-weight:800}
  .muted{color:#94a3b8;font-size:12px;margin-top:8px}
  button{border:0;border-radius:12px;padding:13px 20px;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}
  .primary{background:#38bdf8;color:#06283b} .danger{background:#1f2937;color:#fca5a5}
  .err{color:#fca5a5;font-size:12px;margin-top:10px}
</style>
</head>
<body>
  <header><span class="logo">⚡</span><b>ShareHub Desktop</b></header>
  <main>
    <div class="box">
      <div class="ring" id="ring">💤</div>
      <div class="state" id="state">Offline</div>
      <div class="muted" id="hint">This computer becomes reachable from the ShareHub website. Your ID &amp; password are shown on the website only. No prompts — it shares automatically.</div>
      <button class="primary" id="toggle">Go online</button>
      <div class="err" id="err"></div>
    </div>
  </main>

<script src="config.js"></script>
<script>
(function () {
  const T = window.__TAURI__ || null;
  const invoke = T ? T.core.invoke : async (c,a)=>{ console.log('[stub]',c,a); };
  const listen = T ? T.event.listen : async ()=>(()=>{});
  const $=(id)=>document.getElementById(id);
  const LS=window.localStorage;
  const CFG=window.__CFG__||{backend:'http://localhost:3000',frontend:'http://localhost:5173'};
  const genId=()=>{let s='';for(let i=0;i<9;i++)s+=Math.floor(Math.random()*10);return s;};

  const cfg={ backend:(CFG.backend||'http://localhost:3000').replace(/\/+$/,''), id:LS.getItem('sh_id')||genId(), pw:LS.getItem('sh_pw')||Math.random().toString(36).slice(2,10) };
  LS.setItem('sh_id',cfg.id); LS.setItem('sh_pw',cfg.pw);
  const wsUrl=cfg.backend.replace(/^http/,'ws')+'/ws';
  const ICE={ iceServers:[
    { urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] },
    { urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' },
  ]};

  let screenStream=null, online=false, shared=false;
  const inject=(d)=> invoke('inject',{ev:d}).catch(()=>{});
  let capTimer=null;
  async function startShare(){
    if(screenStream) return;
    const canvas=document.createElement('canvas'), ctx=canvas.getContext('2d'), img=new Image(); let pending=false;
    const grab=async()=>{ if(pending) return; pending=true;
      try{ const b64=await invoke('capture_frame'); if(b64){
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src='data:image/jpeg;base64,'+b64; });
        if(canvas.width!==img.naturalWidth||canvas.height!==img.naturalHeight){ canvas.width=img.naturalWidth||1280; canvas.height=img.naturalHeight||720; }
        ctx.drawImage(img,0,0);
      } }catch(e){} pending=false; };
    await grab();
    if(!canvas.width){ canvas.width=1280; canvas.height=720; }
    screenStream = canvas.captureStream(12);
    capTimer = setInterval(grab, 90);
    for(const s of sessions()) s.attachScreen();
  }
  function stopShare(){ if(capTimer){ clearInterval(capTimer); capTimer=null; } if(!screenStream) return; for(const s of sessions()) s.detachScreen(); screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; }

  class Session {
    constructor(kind,conf){ this.kind=kind; this.conf=conf; this.ws=null; this.selfId=null; this.peers=new Map(); this.dead=false; this.connect(); }
    connect(){ if(this.dead) return; const ws=new WebSocket(this.conf.wsUrl); this.ws=ws;
      ws.onopen=()=>ws.send(JSON.stringify({type:'hello',key:this.conf.room}));
      ws.onmessage=(e)=>{ let m; try{m=JSON.parse(e.data);}catch{return;} this.onMsg(m); };
      ws.onclose=()=>{ if(this.dead) return; setTimeout(()=>this.connect(),2000); }; ws.onerror=()=>{}; }
    send(o){ if(this.ws&&this.ws.readyState===1) this.ws.send(JSON.stringify(o)); }
    relay(to,d){ this.send({type:'relay',to,d}); } signal(to,d){ this.send({type:'signal',to,d}); }
    onMsg(m){ switch(m.type){
      case 'room-status': this.send(this.kind==='machine'?{type:m.exists?'join':'create',password:this.conf.password,name:this.conf.name,role:'human'}:(m.exists?{type:'join',password:this.conf.password,name:this.conf.name,role:'human'}:{type:'hello',key:this.conf.room})); break;
      case 'joined': this.selfId=m.selfId; (m.peers||[]).forEach(p=>{ if(p.role!=='agent') this.addPeer(p.id); }); this.announce(); break;
      case 'peer-joined': if(m.role!=='agent'){ this.addPeer(m.id); this.announce(); if(!screenStream && window.__ensureShare) window.__ensureShare(); } break;
      case 'peer-left': this.removePeer(m.id); break;
      case 'signal': this.onSignal(m.from,m.d); break;
      case 'relay': this.onRelay(m.from,m.d); break;
    } }
    announce(){ this.relay('*',{t:'agent-bind',agentId:this.selfId,ownerId:this.selfId}); if(this.conf.token) this.relay('*',{t:'agent-ready',agentId:this.selfId,token:this.conf.token}); }
    attachScreen(){ if(!screenStream) return; for(const [,p] of this.peers){ for(const t of screenStream.getTracks()) p.pc.addTrack(t,screenStream); this.meta(p); } }
    detachScreen(){ for(const [,p] of this.peers){ for(const s of p.pc.getSenders()){ if(s.track&&s.track.kind==='video'){ try{p.pc.removeTrack(s);}catch{} } } } }
    meta(p){ if(p.dc&&p.dc.readyState==='open'&&screenStream) p.dc.send(JSON.stringify({t:'stream-meta',sid:screenStream.id,kind:'screen'})); }
    addPeer(id){ if(this.peers.has(id)) return; const polite=String(this.selfId)>String(id); const pc=new RTCPeerConnection(ICE);
      const st={pc,dc:null,polite,makingOffer:false,ignoreOffer:false,candQueue:[]}; this.peers.set(id,st);
      const dc=pc.createDataChannel('ctl',{negotiated:true,id:0}); dc.binaryType='arraybuffer'; st.dc=dc;
      dc.onopen=()=>this.meta(st);
      dc.onmessage=(e)=>{ if(typeof e.data!=='string') return; let m; try{m=JSON.parse(e.data);}catch{return;}
        if(m.t==='claim-owner' && this.conf.token && m.token===this.conf.token){ dc.send(JSON.stringify({t:'creds', id:cfg.id, pw:cfg.pw})); } };
      pc.onicecandidate=(e)=>{ if(e.candidate) this.signal(id,{candidate:e.candidate}); };
      pc.onnegotiationneeded=async()=>{ try{ st.makingOffer=true; await pc.setLocalDescription(); this.signal(id,{description:pc.localDescription}); }catch(e){} finally{ st.makingOffer=false; } };
      pc.oniceconnectionstatechange=()=>{ if(pc.iceConnectionState==='failed'){ try{pc.restartIce();}catch{} } };
      if(screenStream) for(const t of screenStream.getTracks()) pc.addTrack(t,screenStream); }
    removePeer(id){ const p=this.peers.get(id); if(!p) return; try{p.pc.close();}catch{} this.peers.delete(id); }
    async onSignal(from,d){ const p=this.peers.get(from); if(!p) return; const pc=p.pc;
      try{ if(d.description){ const col=d.description.type==='offer'&&(p.makingOffer||pc.signalingState!=='stable'); p.ignoreOffer=!p.polite&&col; if(p.ignoreOffer) return;
          await pc.setRemoteDescription(d.description); for(const c of p.candQueue){ try{await pc.addIceCandidate(c);}catch{} } p.candQueue=[];
          if(d.description.type==='offer'){ await pc.setLocalDescription(); this.signal(from,{description:pc.localDescription}); } }
        else if(d.candidate){ if(pc.remoteDescription&&pc.remoteDescription.type){ try{await pc.addIceCandidate(d.candidate);}catch(e){ if(!p.ignoreOffer) throw e; } } else p.candQueue.push(d.candidate); } }catch(e){} }
    onRelay(from,d){ if(!d||!d.t) return; if(d.t.startsWith('rc-')&&d.t!=='rc-request'&&d.t!=='rc-stop'){ inject(d); } }
    close(){ this.dead=true; for(const id of [...this.peers.keys()]) this.removePeer(id); if(this.ws){try{this.ws.close();}catch{}} }
  }

  let machine=null, roomSession=null;
  function sessions(){ return [machine,roomSession].filter(Boolean); }
  function render(){
    $('ring').className='ring'+(online?' on':''); $('ring').textContent=online?'🟢':'💤';
    $('state').textContent=online?'Online':'Offline';
    if(!online){ $('toggle').textContent='Go online'; $('toggle').className='primary'; $('hint').textContent='Reconnecting…'; }
    else if(!shared){ $('toggle').textContent='Share screen'; $('toggle').className='primary'; $('hint').textContent='You are online. Click “Share screen” so anyone who connects can see and control this PC.'; }
    else { $('toggle').textContent='Go offline'; $('toggle').className='danger'; $('hint').textContent='Online & sharing — anyone who connects can control this PC. Your ID & password are on the website only.'; }
  }
  async function shareScreen(){ $('err').textContent=''; try{ await startShare(); shared=true; render(); }catch(e){ if(e&&e.name!=='NotAllowedError') $('err').textContent='Screen share failed: '+(e&&e.message||e); } }
  function goOnline(){ if(machine) return; machine=new Session('machine',{ wsUrl, room:cfg.id, password:cfg.pw, name:'🖥️ Machine' }); online=true; render(); }
  function goOffline(){ stopShare(); shared=false; if(machine)machine.close(); if(roomSession)roomSession.close(); machine=roomSession=null; online=false; render(); }
  function onToggle(){ if(!online) goOnline(); else if(!shared) shareScreen(); else goOffline(); }
  function joinRoom(room,password,token){ if(roomSession) roomSession.close(); room=String(room).trim(); if(!room) return; roomSession=new Session('room',{ wsUrl, room, password, token, name:'🖥️ PC' }); }

  window.__ensureShare = ()=>{ if(online && !shared) shareScreen(); };
  $('toggle').onclick=onToggle; render();
  goOnline();
  shareScreen(); // try immediately (WebView2 auto-select); fallbacks below cover locked-down setups
  ['pointerdown','keydown','focus','mousemove'].forEach(ev=>window.addEventListener(ev, ()=>{ if(online && !shared) shareScreen(); }, { once:true }));

  function fromLink(url){ try{ const p=new URLSearchParams((url.split('?')[1]||'')); const room=decodeURIComponent(p.get('r')||''); const password=decodeURIComponent(p.get('p')||''); const token=p.get('t')||''; if(!room) return; if(!online) goOnline(); joinRoom(room,password,token); if(!shared) shareScreen(); }catch{} }
  listen('deep-link',(e)=>fromLink(e.payload));
  invoke('take_pending_url').then((url)=>{ if(url) fromLink(url); }).catch(()=>{});
})();
</script>
</body>
</html>
