<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ShareHub Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#0b0f19; color:#e2e8f0; height:100vh; display:flex; flex-direction:column; }
  header { padding:16px 18px 10px; display:flex; align-items:center; gap:8px; }
  header .logo { font-size:20px; } header b { font-size:15px; }
  main { flex:1; padding:6px 18px 18px; overflow-y:auto; }
  .card { background:#111827; border:1px solid #1f2937; border-radius:14px; padding:16px; }
  .status { display:flex; align-items:center; gap:8px; font-size:14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#64748b; }
  .dot.ok{background:#34d399;box-shadow:0 0 0 4px #34d39922} .dot.warn{background:#fbbf24}
  .dot.bad{background:#f87171} .dot.live{background:#f87171;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .muted{color:#94a3b8;font-size:12px;margin-top:4px}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{border:0;border-radius:10px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer}
  .primary{background:#38bdf8;color:#06283b} .danger{background:#f43f5e;color:#fff} .ghost{background:#1f2937;color:#cbd5e1}
  label.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;color:#cbd5e1}
  input[type=text]{width:100%;background:#0b1220;border:1px solid #334155;color:#e2e8f0;border-radius:10px;padding:10px;font-size:13px;margin-top:8px}
  .controllers{margin-top:12px}
  .controllers .who{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0}
  details{margin-top:14px} summary{cursor:pointer;color:#94a3b8;font-size:12px}
  .warn-box{margin-top:12px;background:#3f1d1d;border:1px solid #7f1d1d;color:#fecaca;border-radius:10px;padding:10px;font-size:12px}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#1e293b;color:#94a3b8;margin-left:6px}
</style>
</head>
<body>
  <header><span class="logo">⚡</span><b>ShareHub Desktop</b><span class="pill" id="verPill">host</span></header>
  <main>
    <div class="card">
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Idle</span></div>
      <div class="muted" id="roomLine">Waiting for a connection link…</div>

      <div class="row">
        <button class="primary" id="shareBtn" style="display:none">Share my screen</button>
        <button class="ghost" id="stopShareBtn" style="display:none">Stop sharing</button>
      </div>

      <div class="controllers" id="controllers"></div>

      <label class="chk"><input type="checkbox" id="approve" /> Ask me before allowing each new controller</label>

      <div class="row">
        <button class="danger" id="disconnect" style="display:none">Disconnect &amp; cut control</button>
      </div>

      <div class="warn-box">⚠️ While connected, people you allow can see this screen and control its mouse &amp; keyboard. Close this window or click Disconnect to stop instantly.</div>

      <details>
        <summary>Connect manually (paste a sharehub:// link)</summary>
        <input type="text" id="manual" placeholder="sharehub://join?s=...&r=...&p=...&t=..." />
        <div class="row"><button class="ghost" id="manualGo">Connect</button></div>
      </details>
    </div>
  </main>

<script>
(function () {
  const T = window.__TAURI__ || null;
  const invoke = T ? T.core.invoke : async (c,a)=>{ console.log('[stub invoke]',c,a); };
  const listen = T ? T.event.listen : async ()=>(()=>{});
  const $ = (id)=>document.getElementById(id);
  const dot=$('dot'), statusText=$('statusText'), roomLine=$('roomLine'),
        disconnectBtn=$('disconnect'), controllersEl=$('controllers'), approveBox=$('approve'),
        shareBtn=$('shareBtn'), stopShareBtn=$('stopShareBtn');

  const ICE = { iceServers: [
    { urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] },
    { urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject' },
    { urls:'turn:openrelay.metered.ca:443?transport=tcp', username:'openrelayproject', credential:'openrelayproject' },
  ] };

  let ws=null, selfId=null, ownerId=null, token=null, conf=null, screenStream=null;
  const peers=new Map();               // peerId -> { pc, dc, polite, makingOffer, ignoreOffer, candQueue }
  const controllers=new Map();         // peerId -> name
  const pendingApproval=new Set();

  function setStatus(kind,text,sub){ dot.className='dot '+(kind||''); statusText.textContent=text; if(sub!==undefined) roomLine.textContent=sub; }
  function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function renderControllers(){
    disconnectBtn.style.display = ws ? '' : 'none';
    shareBtn.style.display = (ws && !screenStream) ? '' : 'none';
    stopShareBtn.style.display = (ws && screenStream) ? '' : 'none';
    controllersEl.innerHTML = controllers.size
      ? '<div class="muted">Controlling this PC now:</div>' + [...controllers.values()].map(n=>`<div class="who"><span class="dot live"></span>${esc(n)}</div>`).join('')
      : (screenStream ? '<div class="muted">Screen is being shared. Waiting for someone to take control…</div>' : '');
  }

  function parseLink(url){
    try{
      const p=new URLSearchParams((url.split('?')[1]||''));
      const server=decodeURIComponent(p.get('s')||''); const room=decodeURIComponent(p.get('r')||'');
      const password=decodeURIComponent(p.get('p')||''); const tk=p.get('t')||''; const name=decodeURIComponent(p.get('n')||'')||'This PC';
      if(!server||!room) return null;
      const wsUrl=server.replace(/^http/,'ws').replace(/\/+$/,'')+'/ws';
      return { wsUrl, room, password, name, token:tk };
    }catch{ return null; }
  }

  const relay=(to,d)=> ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'relay',to,d}));
  const signal=(to,d)=> ws&&ws.readyState===1&&ws.send(JSON.stringify({type:'signal',to,d}));

  // ---------- WebRTC (send our screen to each viewer) ----------
  function addPeer(id){
    if(peers.has(id)) return;
    const polite = String(selfId) > String(id);
    const pc = new RTCPeerConnection(ICE);
    const st = { pc, dc:null, polite, makingOffer:false, ignoreOffer:false, candQueue:[] };
    peers.set(id, st);
    const dc = pc.createDataChannel('ctl',{negotiated:true,id:0}); dc.binaryType='arraybuffer';
    dc.onopen = ()=>{ if(screenStream) dc.send(JSON.stringify({t:'stream-meta',sid:screenStream.id,kind:'screen'})); };
    st.dc = dc;
    pc.onicecandidate = (e)=>{ if(e.candidate) signal(id,{candidate:e.candidate}); };
    pc.onnegotiationneeded = async ()=>{ try{ st.makingOffer=true; await pc.setLocalDescription(); signal(id,{description:pc.localDescription}); }catch(e){console.error(e);} finally{ st.makingOffer=false; } };
    pc.oniceconnectionstatechange = ()=>{ if(pc.iceConnectionState==='failed'){ try{pc.restartIce();}catch{} } };
    if(screenStream) for(const t of screenStream.getTracks()) pc.addTrack(t, screenStream);
  }
  function removePeer(id){ const p=peers.get(id); if(!p) return; try{p.pc.close();}catch{} peers.delete(id); }

  async function onSignal(from, d){
    const p=peers.get(from); if(!p) return; const pc=p.pc;
    try{
      if(d.description){
        const collision = d.description.type==='offer' && (p.makingOffer || pc.signalingState!=='stable');
        p.ignoreOffer = !p.polite && collision; if(p.ignoreOffer) return;
        await pc.setRemoteDescription(d.description);
        for(const c of p.candQueue){ try{ await pc.addIceCandidate(c);}catch{} } p.candQueue=[];
        if(d.description.type==='offer'){ await pc.setLocalDescription(); signal(from,{description:pc.localDescription}); }
      } else if(d.candidate){
        if(pc.remoteDescription&&pc.remoteDescription.type){ try{ await pc.addIceCandidate(d.candidate);}catch(e){ if(!p.ignoreOffer) throw e; } }
        else p.candQueue.push(d.candidate);
      }
    }catch(e){ console.error('signal',e); }
  }

  async function startShare(){
    try{
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:15 }, audio:false });
      screenStream.getVideoTracks()[0].addEventListener('ended', stopShare);
      for(const [,p] of peers){ for(const t of screenStream.getTracks()) p.pc.addTrack(t, screenStream);
        if(p.dc&&p.dc.readyState==='open') p.dc.send(JSON.stringify({t:'stream-meta',sid:screenStream.id,kind:'screen'})); }
      setStatus('ok','Sharing screen — ready for control', roomLine.textContent); renderControllers();
    }catch(e){ if(e && e.name!=='NotAllowedError') setStatus('bad','Screen share failed: '+e.message); }
  }
  function stopShare(){
    if(!screenStream) return;
    for(const [,p] of peers){ for(const s of p.pc.getSenders()){ if(s.track&&s.track.kind==='video'){ try{p.pc.removeTrack(s);}catch{} } } }
    screenStream.getTracks().forEach(t=>t.stop()); screenStream=null; renderControllers();
    setStatus('ok','Connected — screen not shared', roomLine.textContent);
  }

  // ---------- room connection ----------
  function connect(c){
    if(ws){ try{ws.close();}catch{} }
    conf=c; token=c.token; controllers.clear(); ownerId=null; renderControllers();
    setStatus('warn','Connecting…',`Room "${c.room}"`);
    ws=new WebSocket(c.wsUrl);
    ws.onopen=()=>ws.send(JSON.stringify({type:'hello',key:c.room}));
    ws.onmessage=(e)=>{ let m; try{m=JSON.parse(e.data);}catch{return;} onMsg(m); };
    ws.onclose=()=>{ setStatus('bad','Disconnected','Connection closed'); disconnectBtn.style.display='none'; ws=null; };
    ws.onerror=()=>{};
  }

  function announce(){ relay('*',{t:'agent-bind', agentId:selfId, ownerId:selfId}); relay('*',{t:'agent-ready', agentId:selfId, token}); }

  function onMsg(m){
    switch(m.type){
      case 'room-status':
        if(!m.exists){ setStatus('bad','Room not found','Ask the host to open the room first'); return; }
        ws.send(JSON.stringify({type:'join', password:conf.password, name:conf.name, role:'human'}));
        break;
      case 'error': setStatus('bad', m.code==='badpass'?'Wrong password':(m.message||'Error'),''); break;
      case 'joined':
        selfId=m.selfId;
        setStatus('ok','Connected', `Room "${conf.room}" · ${conf.name}`);
        disconnectBtn.style.display='';
        (m.peers||[]).forEach(p=>{ if(p.role!=='agent') addPeer(p.id); });
        announce();
        startShare(); // auto-offer to share the whole screen (host picks the screen once)
        break;
      case 'peer-joined': if(m.role!=='agent'){ addPeer(m.id); announce(); } break;
      case 'peer-left': removePeer(m.id); if(controllers.delete(m.id)) renderControllers(); break;
      case 'signal': onSignal(m.from, m.d); break;
      case 'relay': onRelay(m.from, m.d); break;
    }
  }

  async function allow(from, who){
    if(controllers.has(from)) return true;
    if(approveBox.checked){ if(pendingApproval.has(from)) return false; pendingApproval.add(from);
      const ok=confirm(`Allow "${who}" to control this PC?`); pendingApproval.delete(from);
      if(!ok){ relay(from,{t:'rc-deny'}); return false; } }
    controllers.set(from, who); renderControllers();
    relay(from,{t:'rc-grant', agentId:selfId});
    return true;
  }
  async function onRelay(from, d){
    if(!d||!d.t) return;
    if(d.t==='rc-request'){ await allow(from, d.name||'A peer'); return; }
    if(d.t==='rc-stop'){ if(controllers.delete(from)) renderControllers(); return; }
    if(d.t==='unpair'){ disconnectBtn.click(); return; }
    if(d.t.startsWith('rc-')){ if(!controllers.has(from)){ if(!(await allow(from,'A peer'))) return; } invoke('inject',{ev:d}).catch(()=>{}); }
  }

  disconnectBtn.onclick=()=>{ stopShare(); for(const id of [...peers.keys()]) removePeer(id); if(ws){try{ws.close();}catch{}} ws=null; controllers.clear(); renderControllers(); setStatus('','Disconnected','You can close this window'); };
  shareBtn.onclick=startShare; stopShareBtn.onclick=stopShare;
  $('manualGo').onclick=()=>{ const c=parseLink($('manual').value.trim()); if(c) connect(c); else setStatus('bad','Invalid link',''); };

  listen('deep-link',(e)=>{ const c=parseLink(e.payload); if(c) connect(c); });
  invoke('take_pending_url').then((url)=>{ if(url){ const c=parseLink(url); if(c) connect(c); } }).catch(()=>{});
})();
</script>
</body>
</html>
