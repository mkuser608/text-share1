name: Build ShareHub Desktop

# Push a tag like v1.0.0 to build installers and publish them to a GitHub Release.
# Or run manually (Actions -> Build ShareHub Desktop -> Run workflow) to get artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  BACKEND_URL: https://api.text.ipoup.in
  FRONTEND_URL: https://text.ipoup.in

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
            targets: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin x86_64-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (universal)
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install deps + config + icons
        working-directory: desktop
        run: |
          npm install
          node gen-config.mjs
          npx --yes @tauri-apps/cli icon icon-source.png

      - name: Build + publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'ShareHub Desktop ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your OS below. Install once, then use the website.'
          releaseDraft: false
          prerelease: false

      - name: Upload installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sharehub-desktop-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
